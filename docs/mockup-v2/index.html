<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCCF·HA v2 — Departamentos</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body class="portada-body">

<header class="topbar">
  <div class="marca">
    <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
      <rect x="2" y="4" width="20" height="26" rx="3" fill="var(--azul)"/>
      <path d="M8 11h8M8 16h8M8 21h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 2h9a3 3 0 0 1 3 3v18" fill="none" stroke="var(--acento)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="marca-texto">
      <strong>PCCF·HA</strong>
      <span>Elaboración de PD, PCCF y memoria · mockup v2</span>
    </div>
  </div>
  <div class="topbar-derecha">
    <button class="icono-btn" id="btn-tema" title="Cambiar entre tema claro y oscuro" aria-label="Cambiar tema">
      <svg viewBox="0 0 24 24" class="ico"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main class="portada">
  <div class="portada-intro">
    <h1>Departamentos del centro</h1>
    <p>Cada departamento elabora aquí su memoria, su PCCF y sus programaciones didácticas.
       De momento solo el de <strong>Informática</strong> tiene documentos cargados en el mockup.</p>
  </div>

  <div class="dept-grid">
    <a class="dept-card" href="app.html">
      <svg viewBox="0 0 24 24" class="ico-d" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 21h8m-4-4v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="dept-nombre">Informática</span>
      <span class="chip chip-disponible">7 documentos</span>
    </a>

    <button class="dept-card" data-dept="Agraria">
      <svg viewBox="0 0 24 24" class="ico-d" aria-hidden="true"><path d="M12 21V10m0 0c0-3 2-5 6-5 0 4-2.5 6-6 6Zm0 0c0-3-2-5-6-5 0 4 2.5 6 6 6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span class="dept-nombre">Agraria</span>
      <span class="chip">sin cargar</span>
    </button>

    <button class="dept-card" data-dept="Servicios a la Comunidad">
      <svg viewBox="0 0 24 24" class="ico-d" aria-hidden="true"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 19a6 6 0 0 1 12 0m2.2-5.2A4.5 4.5 0 0 1 21 18.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="dept-nombre">Servicios a la Comunidad</span>
      <span class="chip">sin cargar</span>
    </button>

    <button class="dept-card" data-dept="Lengua">
      <svg viewBox="0 0 24 24" class="ico-d" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span class="dept-nombre">Lengua</span>
      <span class="chip">sin cargar</span>
    </button>

    <button class="dept-card" data-dept="Matemáticas">
      <svg viewBox="0 0 24 24" class="ico-d" aria-hidden="true"><path d="M5 7h6M8 4v6m6 8h6m-3-3v6m-8-5 4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="dept-nombre">Matemáticas</span>
      <span class="chip">sin cargar</span>
    </button>

    <button class="dept-card" data-dept="Tecnología">
      <svg viewBox="0 0 24 24" class="ico-d" aria-hidden="true"><path d="m14.5 5.5 4 4L9 19H5v-4l9.5-9.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m12.5 7.5 4 4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      <span class="dept-nombre">Tecnología</span>
      <span class="chip">sin cargar</span>
    </button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
  document.getElementById('btn-tema').addEventListener('click', () => {
    const raiz = document.documentElement;
    raiz.dataset.tema = raiz.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    try { localStorage.setItem('tema', raiz.dataset.tema); } catch (e) {}
  });

  let temporizador;
  const toast = document.getElementById('toast');
  document.querySelectorAll('.dept-card[data-dept]').forEach((btn) => {
    btn.addEventListener('click', () => {
      toast.textContent = 'El departamento de ' + btn.dataset.dept + ' todavía no tiene documentos importados.';
      toast.classList.add('ver');
      clearTimeout(temporizador);
      temporizador = setTimeout(() => toast.classList.remove('ver'), 2800);
    });
  });
</script>
</body>
</html>
