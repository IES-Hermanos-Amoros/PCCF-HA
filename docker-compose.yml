# MongoDB para desarrollo y para ejecutar las pruebas contra el adaptador real.
#
#   docker compose up -d
#   MONGODB_URI=mongodb://localhost:27017 npm test
#
# Sin MONGODB_URI la aplicación usa el adaptador de memoria y no hace falta esto.
# `down` conserva los datos; `down -v` los borra.

services:
  mongo:
    image: mongo:8
    container_name: pccf-mongo
    restart: unless-stopped
    ports:
      # Solo el bucle local, no la red.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-datos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-datos:
